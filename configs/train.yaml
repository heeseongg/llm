data:
  text_path: data/raw/input.txt
  encoding: utf-8
  block_size: 256

model:
  max_seq_len: 256
  d_model: 384
  n_heads: 6
  n_layers: 8
  d_ff: 1536
  dropout: 0.1

train:
  device: cuda
  batch_size: 24
  shuffle: true
  num_workers: 0
  drop_last: true
  lr: 3e-4
  weight_decay: 0.0
  betas: [0.9, 0.95]
  grad_clip: 1.0
  num_epochs: 5
  checkpoint_dir: checkpoints
  save_every: 100
  eval_every: 5
  eval_batch_size: 32
  save_best_checkpoint: true
  best_checkpoint_name: best.pt
